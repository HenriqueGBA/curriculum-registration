name: .NET Tests

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/CurriculumRegistration.Api.Tests/CurriculumRegistration.Api.Tests.csproj

      - name: Build
        run: dotnet build backend/CurriculumRegistration.Api.Tests/CurriculumRegistration.Api.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/CurriculumRegistration.Api.Tests/CurriculumRegistration.Api.Tests.csproj --no-build --configuration Release --verbosity normal